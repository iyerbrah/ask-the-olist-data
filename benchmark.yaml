# ---------- medium ----------
- id: m01
  difficulty: medium
  question: Which 5 customer states placed the most orders? Return the state and the number of orders.
  gold_sql: >
    SELECT c.customer_state, count(*) AS orders
    FROM orders o JOIN customers c ON o.customer_id = c.customer_id
    GROUP BY c.customer_state ORDER BY orders DESC LIMIT 5

- id: m02
  difficulty: medium
  question: Which category has the most items sold? Return the category and the number of items.
  gold_sql: >
    SELECT t.product_category_name_english, count(*) AS items
    FROM order_items i
    JOIN products p ON i.product_id = p.product_id
    JOIN product_category_name_translation t ON p.product_category_name = t.product_category_name
    GROUP BY 1 ORDER BY items DESC LIMIT 1

- id: m03
  difficulty: medium
  question: Which 3 customer states have the highest average review score? Return the state and the average score.
  gold_sql: >
    SELECT c.customer_state, avg(r.review_score) AS avg_score
    FROM order_reviews r
    JOIN orders o ON r.order_id = o.order_id
    JOIN customers c ON o.customer_id = c.customer_id
    GROUP BY c.customer_state ORDER BY avg_score DESC LIMIT 3

- id: m04
  difficulty: medium
  question: How many delivered orders reached the customer after the estimated delivery date?
  gold_sql: >
    SELECT count(*) FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date > order_estimated_delivery_date

- id: m05
  difficulty: medium
  question: How many orders were purchased in each month of 2018? Return the month number and the number of orders.
  gold_sql: >
    SELECT month(order_purchase_timestamp) AS m, count(*) FROM orders
    WHERE year(order_purchase_timestamp) = 2018 GROUP BY m

- id: m06
  difficulty: medium
  question: Which 5 sellers sold the most items? Return the seller id and the number of items.
  gold_sql: SELECT seller_id, count(*) AS items FROM order_items GROUP BY seller_id ORDER BY items DESC LIMIT 5

- id: m07
  difficulty: medium
  question: Among orders that have at least one item, what is the average number of items per order?
  gold_sql: SELECT count(*) * 1.0 / count(DISTINCT order_id) FROM order_items

- id: m08
  difficulty: medium
  question: What is the total payment value for each payment type? Return the payment type and the total.
  gold_sql: SELECT payment_type, sum(payment_value) FROM order_payments GROUP BY payment_type

- id: m09
  difficulty: medium
  question: For delivered orders, what is the average time from purchase to delivery to the customer, in days, counting fractions of a day?
  gold_sql: >
    SELECT avg(epoch(order_delivered_customer_date - order_purchase_timestamp)) / 86400
    FROM orders WHERE order_status = 'delivered'

- id: m10
  difficulty: medium
  question: How many orders contain more than one item?
  gold_sql: SELECT count(*) FROM (SELECT order_id FROM order_items GROUP BY order_id HAVING count(*) > 1)

- id: m11
  difficulty: medium
  question: Which 3 cities have the most sellers? Return the city and the number of sellers.
  gold_sql: SELECT seller_city, count(*) AS sellers FROM sellers GROUP BY seller_city ORDER BY sellers DESC LIMIT 3

- id: m12
  difficulty: medium
  question: Which 5 categories have the highest average item price? Return the category and the average price.
  gold_sql: >
    SELECT t.product_category_name_english, avg(i.price) AS avg_price
    FROM order_items i
    JOIN products p ON i.product_id = p.product_id
    JOIN product_category_name_translation t ON p.product_category_name = t.product_category_name
    GROUP BY 1 ORDER BY avg_price DESC LIMIT 5

- id: m13
  difficulty: medium
  question: How many delivered orders were placed by customers in the state MG?
  gold_sql: >
    SELECT count(*) FROM orders o JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.order_status = 'delivered' AND c.customer_state = 'MG'

- id: m14
  difficulty: medium
  question: How many distinct products have been sold at least once?
  gold_sql: SELECT count(DISTINCT product_id) FROM order_items

- id: m15
  difficulty: medium
  question: What percentage of reviews have a score of 5? Give a number between 0 and 100 rounded to 2 decimals.
  gold_sql: SELECT round(100.0 * count(*) FILTER (WHERE review_score = 5) / count(*), 2) FROM order_reviews

- id: m16
  difficulty: medium
  question: On which day of the week are the most orders purchased? Return the English day name and the number of orders.
  gold_sql: >
    SELECT dayname(order_purchase_timestamp) AS day, count(*) AS orders
    FROM orders GROUP BY day ORDER BY orders DESC LIMIT 1

- id: m17
  difficulty: medium
  question: How many orders were paid using more than one payment type?
  gold_sql: >
    SELECT count(*) FROM (SELECT order_id FROM order_payments GROUP BY order_id HAVING count(DISTINCT payment_type) > 1)

- id: m18
  difficulty: medium
  question: What is the average payment value of credit card payments with more than 6 installments?
  gold_sql: >
    SELECT avg(payment_value) FROM order_payments
    WHERE payment_type = 'credit_card' AND payment_installments > 6

- id: m19
  difficulty: medium
  question: How many sellers have sold more than 100 items?
  gold_sql: SELECT count(*) FROM (SELECT seller_id FROM order_items GROUP BY seller_id HAVING count(*) > 100)

- id: m20
  difficulty: medium
  question: For each review score, how many reviews include a written comment message? Return the score and the count.
  gold_sql: >
    SELECT review_score, count(*) FROM order_reviews
    WHERE review_comment_message IS NOT NULL GROUP BY review_score

# ---------- hard ----------
- id: h01
  difficulty: hard
  question: What is the total revenue?
  gold_sql: >
    SELECT sum(i.price) FROM order_items i JOIN orders o ON i.order_id = o.order_id
    WHERE o.order_status = 'delivered'

- id: h02
  difficulty: hard
  question: How many customers have placed more than one order?
  gold_sql: >
    SELECT count(*) FROM (
      SELECT c.customer_unique_id FROM orders o JOIN customers c ON o.customer_id = c.customer_id
      GROUP BY c.customer_unique_id HAVING count(*) > 1)

- id: h03
  difficulty: hard
  question: Which 5 categories have the highest revenue? Return the category and its revenue.
  gold_sql: >
    SELECT t.product_category_name_english, sum(i.price) AS revenue
    FROM order_items i
    JOIN orders o ON i.order_id = o.order_id
    JOIN products p ON i.product_id = p.product_id
    JOIN product_category_name_translation t ON p.product_category_name = t.product_category_name
    WHERE o.order_status = 'delivered'
    GROUP BY 1 ORDER BY revenue DESC LIMIT 5

- id: h04
  difficulty: hard
  question: What percentage of delivered orders were late? Give a number between 0 and 100 rounded to 2 decimals.
  gold_sql: >
    SELECT round(100.0 * count(*) FILTER (WHERE order_delivered_customer_date > order_estimated_delivery_date) / count(*), 2)
    FROM orders WHERE order_status = 'delivered'

- id: h05
  difficulty: hard
  question: Which month had the highest revenue? Return the month as YYYY-MM and the revenue.
  gold_sql: >
    SELECT strftime(o.order_purchase_timestamp, '%Y-%m') AS month, sum(i.price) AS revenue
    FROM order_items i JOIN orders o ON i.order_id = o.order_id
    WHERE o.order_status = 'delivered'
    GROUP BY month ORDER BY revenue DESC LIMIT 1

- id: h06
  difficulty: hard
  question: What is the total payment value of orders that contain at least one item in the health_beauty category?
  gold_sql: >
    SELECT sum(payment_value) FROM order_payments
    WHERE order_id IN (
      SELECT i.order_id FROM order_items i
      JOIN products p ON i.product_id = p.product_id
      JOIN product_category_name_translation t ON p.product_category_name = t.product_category_name
      WHERE t.product_category_name_english = 'health_beauty')

- id: h07
  difficulty: hard
  question: Among delivered orders, what is the average total item price per order, excluding freight?
  gold_sql: >
    SELECT avg(order_total) FROM (
      SELECT i.order_id, sum(i.price) AS order_total
      FROM order_items i JOIN orders o ON i.order_id = o.order_id
      WHERE o.order_status = 'delivered' GROUP BY i.order_id)

- id: h08
  difficulty: hard
  question: Which 3 sellers have the highest revenue? Return the seller id and the revenue.
  gold_sql: >
    SELECT i.seller_id, sum(i.price) AS revenue
    FROM order_items i JOIN orders o ON i.order_id = o.order_id
    WHERE o.order_status = 'delivered'
    GROUP BY i.seller_id ORDER BY revenue DESC LIMIT 3

- id: h09
  difficulty: hard
  question: What is the average review score of reviews for delivered orders that arrived late?
  gold_sql: >
    SELECT avg(r.review_score) FROM order_reviews r JOIN orders o ON r.order_id = o.order_id
    WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date > o.order_estimated_delivery_date

- id: h10
  difficulty: hard
  question: How many customers are in the state SP?
  gold_sql: SELECT count(DISTINCT customer_unique_id) FROM customers WHERE customer_state = 'SP'

- id: h11
  difficulty: hard
  question: What percentage of customers have placed more than one order? Give a number between 0 and 100 rounded to 2 decimals.
  gold_sql: >
    SELECT round(100.0 * count(*) FILTER (WHERE n > 1) / count(*), 2) FROM (
      SELECT c.customer_unique_id, count(*) AS n
      FROM orders o JOIN customers c ON o.customer_id = c.customer_id
      GROUP BY c.customer_unique_id)

- id: h12
  difficulty: hard
  question: For each year of purchase, which customer state had the highest revenue? Return the year, the state and the revenue.
  gold_sql: >
    SELECT yr, customer_state, revenue FROM (
      SELECT year(o.order_purchase_timestamp) AS yr, c.customer_state, sum(i.price) AS revenue,
             row_number() OVER (PARTITION BY year(o.order_purchase_timestamp) ORDER BY sum(i.price) DESC) AS rn
      FROM order_items i
      JOIN orders o ON i.order_id = o.order_id
      JOIN customers c ON o.customer_id = c.customer_id
      WHERE o.order_status = 'delivered'
      GROUP BY 1, 2)
    WHERE rn = 1

- id: h13
  difficulty: hard
  question: For how many orders does the total payment value differ from the total of item prices plus freight by more than 1? Only consider orders that have both items and payments.
  gold_sql: >
    SELECT count(*) FROM
      (SELECT order_id, sum(price + freight_value) AS item_total FROM order_items GROUP BY order_id) i
      JOIN (SELECT order_id, sum(payment_value) AS paid FROM order_payments GROUP BY order_id) p
      ON i.order_id = p.order_id
    WHERE abs(i.item_total - p.paid) > 1

- id: h14
  difficulty: hard
  question: For delivered orders, what is the median time from purchase to delivery to the customer, in days, counting fractions of a day?
  gold_sql: >
    SELECT median(epoch(order_delivered_customer_date - order_purchase_timestamp)) / 86400
    FROM orders WHERE order_status = 'delivered'

- id: h15
  difficulty: hard
  question: How many customers made their first purchase in 2018?
  gold_sql: >
    SELECT count(*) FROM (
      SELECT c.customer_unique_id FROM orders o JOIN customers c ON o.customer_id = c.customer_id
      GROUP BY c.customer_unique_id HAVING year(min(o.order_purchase_timestamp)) = 2018)

