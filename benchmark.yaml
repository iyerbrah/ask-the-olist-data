# Each item: id, difficulty (easy | medium | hard | unanswerable), question, gold_sql.
# easy = one table; medium = joins and grouping; hard = relies on a rule or trap in schema.md.
# 15 easy, 20 medium, 15 hard, 10 unanswerable.

